name: generate-audio

# 独立的音频生成任务：为 data/cards.json 里缺失的卡片补齐 Edge TTS 音频，
# 提交回 media/。这次提交会触发 build-apkg 工作流，从而自动发布带音频的新版。
# 触发方式：手动 workflow_dispatch，或 data/** 有推送时（新卡需要音频）。
# 注意：本工作流不监听 media/**，所以它自己的提交不会递归触发自己。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate missing audio (Edge TTS)
        run: python tools/generate_audio.py

      - name: Commit generated audio back
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add media
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add generated audio"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 的推送不会自动触发其他工作流，必须显式派发打包发布。
      - name: Trigger build and release
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo ${{ github.repository }}
